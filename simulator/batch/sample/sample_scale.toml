# Tiny DE-01 scale config used ONLY to produce the committed DE-04 sample
# fixture (simulator/batch/sample/output/) and fast CLI tests. Not a
# production scale; see simulator/config/default_scale.toml for that.

seed = 42

[counts]
vehicle_count = 6
route_count = 2
stop_count = 12
stop_count_min = 10
stop_count_max = 20
depot_count = 2

[sydney_bounding_box]
min_latitude = -34.05
max_latitude = -33.55
min_longitude = 150.55
max_longitude = 151.35

[fleet]
min_vehicle_capacity = 40
max_vehicle_capacity = 80

[route_shape]
min_stops_per_route = 4
max_stops_per_route = 6

[depot]
min_capacity = 20
max_capacity = 60
