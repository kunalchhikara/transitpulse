# Default DE-04 batch/historical dataset configuration.
#
# Drives the volume, date range, seed and value ranges of the PROJECT.md
# section 7 batch sources generated by `python -m simulator.batch`:
# schedules, schedule_stop_times, historical_trips, historical_telemetry,
# passenger_journeys, service_disruptions, (optional) weather_observations and
# the DE-10 vehicle_depot_assignments change history.
#
# Reference entities (vehicles/routes/stops/depots) are NOT configured here:
# they come from DE-01's `simulator/config/default_scale.toml` (pass
# --scale-config to the CLI to rescale them). Tune the values below (or pass
# an alternate file via --batch-config) instead of editing code, per
# PROJECT.md section 19.

[batch]
# Seeds every per-day / per-trip / per-route RNG stream (see
# simulator/batch/rng.py). Same seed + same config -> byte-identical output.
seed = 20250106
# First operating (service) date, local time.
start_date = 2025-01-06
# Number of consecutive operating days to generate. Primary volume driver.
service_days = 7
# Fixed local-time -> UTC offset (AEST = +10). Fixed offset (no DST) keeps
# output deterministic and stdlib-only; see README "Known limitations".
utc_offset_hours = 10

[schedules]
# Daily service window (local time) and timetable headway per route.
# Trips per route per day = floor((end - start) / headway) + 1.
service_start_time = 06:00:00
service_end_time = 22:00:00
headway_minutes = 60
# Scheduled running time between two consecutive stops, sampled once per
# route segment (so a route's timetable is stable day to day).
min_segment_runtime_seconds = 120
max_segment_runtime_seconds = 420
# Scheduled dwell at each intermediate stop.
dwell_seconds = 30
# Minimum turnaround before a vehicle can start its next scheduled trip.
min_layover_minutes = 5
# Timetables are "published" this many days before the service date; this
# drives schedules/schedule_stop_times `updated_at` (watermark column).
publish_lead_days = 14

[operations]
# Delay (seconds, negative = early) at the first stop of a trip, before any
# disruption impact is added.
min_start_delay_seconds = -60
max_start_delay_seconds = 180
# Per-segment change in delay as the trip progresses.
min_segment_drift_seconds = -20
max_segment_drift_seconds = 40
# Delay is never allowed to fall below this (a bus cannot run arbitrarily early).
min_delay_seconds = -120
# Telemetry status becomes DELAYED once delay_seconds reaches this
# (5 minutes: a common public-transport "on time" tolerance).
delayed_status_threshold_seconds = 300
# Speed reported by a stop-arrival telemetry snapshot (vehicle is pulling in).
min_arrival_speed_kmh = 0.0
max_arrival_speed_kmh = 8.0
# Time after a trip ends before its operational record is finalised in the
# source system (drives historical_trips `updated_at`).
trip_record_settlement_minutes = 15
# Time after a disruption resolves before its log entry is closed (drives
# service_disruptions `updated_at`).
disruption_record_settlement_minutes = 30

[disruptions]
# Exact number of service disruptions generated per operating day.
per_day = 3

# Severity -> relative weight and route-delay impact range (seconds).
[disruptions.severities.LOW]
weight = 4
min_delay_impact_seconds = 60
max_delay_impact_seconds = 300

[disruptions.severities.MEDIUM]
weight = 3
min_delay_impact_seconds = 300
max_delay_impact_seconds = 900

[disruptions.severities.HIGH]
weight = 2
min_delay_impact_seconds = 900
max_delay_impact_seconds = 1800

[disruptions.severities.CRITICAL]
weight = 1
min_delay_impact_seconds = 1800
max_delay_impact_seconds = 3600

# Disruption types. `effect` selects the implemented behaviour:
#   DELAY     - route-scoped: every trip on the route departing inside the
#               disruption window gets the severity's delay impact added.
#   BREAKDOWN - trip-scoped: the vehicle breaks down after arriving at a
#               random stop; the trip is PARTIAL and the vehicle's later trips
#               departing before the disruption ends are CANCELLED.
#   CANCEL    - trip-scoped: the trip (and the vehicle's later trips departing
#               before the disruption ends) is CANCELLED.
[[disruptions.types]]
name = "VEHICLE_BREAKDOWN"
effect = "BREAKDOWN"
weight = 3
min_duration_minutes = 45
max_duration_minutes = 180

[[disruptions.types]]
name = "ROUTE_CONGESTION"
effect = "DELAY"
weight = 4
min_duration_minutes = 30
max_duration_minutes = 150

[[disruptions.types]]
name = "ROADWORKS"
effect = "DELAY"
weight = 2
min_duration_minutes = 120
max_duration_minutes = 360

[[disruptions.types]]
name = "SEVERE_WEATHER"
effect = "DELAY"
weight = 1
min_duration_minutes = 60
max_duration_minutes = 240

[[disruptions.types]]
name = "DRIVER_UNAVAILABLE"
effect = "CANCEL"
weight = 2
min_duration_minutes = 30
max_duration_minutes = 120

[passengers]
# Journeys per operated trip (capped at the vehicle's capacity, so occupancy
# can never exceed capacity).
min_journeys_per_trip = 5
max_journeys_per_trip = 30
# Size of the synthetic, pseudonymous travel-card population (no PII).
card_population = 5000
# Time after alighting before a tap-on/tap-off journey record settles
# (drives passenger_journeys `updated_at`).
settlement_lag_minutes = 60

# Fare product -> relative weight and flat synthetic fare (AUD).
[passengers.fare_types.ADULT]
weight = 6
fare_aud = 3.20

[passengers.fare_types.CONCESSION]
weight = 2
fare_aud = 1.60

[passengers.fare_types.CHILD]
weight = 1
fare_aud = 1.60

[passengers.fare_types.SENIOR]
weight = 1
fare_aud = 2.50

[weather]
# Optional synthetic weather observations: one station per depot.
enabled = true
# Must divide 1440 (minutes per day).
observation_interval_minutes = 60
base_temperature_c = 22.0
diurnal_amplitude_c = 6.0
# Local hour at which the diurnal temperature curve peaks.
peak_temperature_hour = 15
temperature_noise_c = 1.5
rain_probability = 0.15
max_rainfall_mm = 12.0
heavy_rain_threshold_mm = 6.0
max_wind_speed_kmh = 70.0
storm_wind_threshold_kmh = 50.0
cloudy_probability = 0.35

[fleet_changes]
# DE-10 vehicle-to-depot assignment history (`vehicle_depot_assignments`),
# the change source for an SCD Type 2 `dim_vehicle`. Every DE-01 vehicle gets
# one INITIAL row (its home depot) effective on `start_date`. When enabled,
# exactly `transfers_per_day` vehicles are transferred to a different depot
# effective from local midnight of each later service date, and trips /
# trip-scoped disruptions on and after that date are attributed to the new
# depot. Disabled (or section absent) -> INITIAL rows only and every other
# dataset is byte-identical to pre-DE-10 output.
# Rows = vehicles + transfers_per_day x (service_days - 1) when enabled.
enabled = true
transfers_per_day = 1
# Transfers are drawn from this many relief vehicles (picked once per seed).
# 6 transfers over a 3-vehicle pool -> at least one vehicle moves >= 2 times.
relief_pool_size = 3
# Assignment recorded (`updated_at`) this many days before it takes effect.
# Must be >= schedules.publish_lead_days (applies to INITIAL rows too, so even
# when transfers are off). Omit to default to publish_lead_days.
notice_days = 21
