name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: hashFiles('simulator/requirements*.txt') != ''
        run: pip install -r simulator/requirements.txt
      - name: Install dev tools
        if: hashFiles('simulator/**/*.py') != ''
        run: pip install ruff pytest
      - name: Lint (ruff)
        if: hashFiles('simulator/**/*.py') != ''
        run: ruff check simulator
      - name: Test (pytest)
        if: hashFiles('simulator/**/*.py') != ''
        run: pytest simulator -q

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('website/package.json') != ''
        with:
          node-version: "20"
      - name: Install dependencies
        if: hashFiles('website/package.json') != ''
        working-directory: website
        run: npm ci
      - name: Lint
        if: hashFiles('website/package.json') != ''
        working-directory: website
        run: npm run lint
      - name: Build
        if: hashFiles('website/package.json') != ''
        working-directory: website
        run: npm run build
